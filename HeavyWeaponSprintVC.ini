; HeavyWeaponSprintVC - GTA Vice City PC v1.0  (NOT COMPILED, NOT TESTED)
; Reloaded automatically when the file is saved.
; While holding the sprint key (keyboard or controller through GInput) with one of the weapons below, Tommy runs faster.
[Settings]
Enabled=1

; 1 = writes HeavyWeaponSprintVC.log (game folder) to diagnose problems. 0 = no log.
EnableLog=0

; Run speed multiplier. 2.0 = twice as fast. Decimals are allowed (1.5, 2.5, 3...). Maximum 10. 1.0 = no change.
SpeedMultiplier=2.0

; Weapon types that get the boost (comma separated). Default list:
; 6=Baseball bat 9=Machete 11=Chainsaw 19=Chromegun(Shotgun) 20=Shotgspa(SPAS-12) 21=Buddyshot(Stubby) 26=M4 27=Ruger
; 28=Sniper 29=Laser(Laserscope sniper) 30=Rocket launcher 31=Flamethrower 32=M60 33=Minigun
; Others if you want them: 1=Brass knuckles 2=Screwdriver 3=Golf club 4=Nightstick 5=Knife 7=Hammer 8=Cleaver 10=Katana
; 12=Grenade 15=Molotov 17=Colt45 18=Python 22=Tec9 23=Uzi 24=Ingram 25=MP5
Weapons=6,9,11,19,20,21,26,27,28,29,30,31,32,33

; ---- Stamina (breath) ----
; The boost only works while the player is NOT out of breath. The game lets a normal sprint go on below 0 and only ends it when the
; stamina reaches -150, so the default is -150: the boost lasts as long as a sprint with a light weapon would.
; Set 0 if you want it to stop as soon as the stamina reaches 0 (shorter).
TiredBelow=-150

; After getting out of breath, the boost only comes back when the stamina is restored to this value or more.
; 0 = back once the breath is positive again. -150 = back as soon as the game would allow a sprint again (as short as possible).
; Higher (e.g. 75) = longer rest. The stamina goes from about 0 to the maximum (150+) in roughly 6 seconds standing still.
ResumeAt=0

; 1 = running boosted drains the stamina exactly like a normal sprint with a light weapon. 0 = it costs nothing.
DrainStamina=1

; 1 = running boosted also trains the maximum stamina like a normal sprint (the game raises it with sprint time). 0 = no training.
TrainStamina=1
